<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>{% block title %}RAC - Gestion des congés{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Feather Icons -->
  <script src="https://unpkg.com/feather-icons"></script>
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      background-size: 400% 400%;
      animation: gradient 15s ease infinite;
      min-height: 100vh;
    }

    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .glass {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-pistache {
      background-color: #a3d9a5;
      color: white;
      transition: 0.3s;
    }

    .btn-pistache:hover {
      background-color: #8ac58c;
    }
  </style>
</head>

<body class="flex text-white">

  {% if user.is_authenticated %}
  <!-- ✅ Sidebar -->
  <aside class="w-64 hidden md:flex flex-col glass p-6 space-y-6 min-h-screen">

    <div class="text-2xl font-bold tracking-wide">🌿 RAC</div>

    <nav class="space-y-4 text-sm">

      {% if user.is_staff %}
        <!-- ADMIN MENU -->
        <a href="{% url 'history_admin' %}" class="flex items-center gap-2 hover:text-pistache transition">
          <i data-feather="search"></i> Rechercher un employé
        </a>
      {% else %}
        <!-- EMPLOYÉ MENU -->
        <a href="{% url 'my_history' %}" class="flex items-center gap-2 hover:text-pistache transition">
          <i data-feather="clock"></i> Mon historique
        </a>

        <a href="{% url 'submit_leave' %}" class="flex items-center gap-2 hover:text-pistache transition">
          <i data-feather="edit"></i> Nouvelle demande
        </a>

        <a href="{% url 'chat_leave' 1 %}" class="flex items-center gap-2 hover:text-pistache transition">
          <i data-feather="message-circle"></i> Assistant RH
        </a>
      {% endif %}

      <!-- Déconnexion -->
      <form method="post" action="{% url 'logout' %}" class="pt-6">
        {% csrf_token %}
        <button type="submit" class="flex items-center gap-2 text-red-400 hover:text-red-600 transition">
          <i data-feather="log-out"></i> Déconnexion
        </button>
      </form>
    </nav>
  </aside>
  {% endif %}

  <!-- ✅ Main content -->
  <main class="flex-1 p-6">
    <div class="glass w-full max-w-6xl mx-auto p-8 rounded-xl shadow-md">
      {% block content %}
      {% endblock %}
    </div>
  </main>

  <script>
    feather.replace(); // active les icônes feather
  </script>
</body>
</html>
