<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}RAC{% endblock %}</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Police moderne -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <!-- Couleurs & style global -->
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
    }
    :root {
      --pistache: #a3d9a5;
    }
    .btn-pistache {
      background-color: var(--pistache);
      color: white;
      transition: background-color 0.3s ease;
    }
    .btn-pistache:hover {
      background-color: #8ac58c;
    }
  </style>
</head>

<body>

  <!-- Barre de navigation -->
  <nav class="bg-white shadow px-4 py-3 mb-4 flex justify-between items-center">
    <div class="text-lg font-semibold text-gray-700">🌿 RAC | Gestion des congés</div>
    <form method="post" action="{% url 'logout' %}" class="m-0">
      {% csrf_token %}
      <button class="btn btn-sm btn-outline-danger">🚪 Déconnexion</button>
    </form>
  </nav>

  <!-- Contenu de la page -->
  <div class="container">
    {% block content %}
    <!-- Le contenu des autres pages s'affichera ici -->
    {% endblock %}
  </div>

</body>
</html>
